[metadata]
name = led-badge-writer
version = attr: m18writer.__version__
description = Write text and images to LED name badges (serial M1-8 and USB HID B1248).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Juan Denzer (fork maintainer); original by Amane Katagiri
url = https://github.com/jpdenzer/led-badge-writer
keywords=led, badge, usb, serial, hid, m1-8, b1248
classifiers=
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.7

[options]
zip_safe = False
packages = find:
install_requires =
  pyserial
  Pillow
  numpy

[options.extras_require]
hid =
  hidapi

[options.entry_points]
console_scripts =
  led-badge-writer = m18writer.writer:main
  m18write = m18writer.writer:main
